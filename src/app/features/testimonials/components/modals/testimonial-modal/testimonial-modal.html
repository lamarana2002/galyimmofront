<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/30 px-4 py-6">
  <div class="w-full max-w-2xl rounded-3xl bg-white shadow-2xl overflow-hidden max-h-[90vh] flex flex-col">
    <div class="flex items-center justify-between gap-3 px-6 py-5 border-b border-gray-200">
      <div>
        <p class="text-lg font-bold text-primary-900">{{ title }}</p>
        <p class="text-xs text-primary-400">Renseignez les informations du témoignage.</p>
      </div>
      <button type="button" class="text-primary-400 hover:text-primary-700" (click)="close()">
        <ng-icon name="lucideX" size="18"></ng-icon>
      </button>
    </div>

    <div class="px-6 py-5 space-y-5 overflow-y-auto">
      <div class="grid gap-4 sm:grid-cols-2">
        <label class="block text-sm text-primary-700">
          Nom de l'auteur *
          <input
            [ngModel]="form().name"
            (ngModelChange)="form.update(f => ({ ...f, name: $event }))"
            type="text"
            placeholder="Nom complet"
            class="mt-2 w-full rounded-2xl border border-gray-200 px-4 py-3 text-sm text-primary-900 focus:border-secondary-500 focus:outline-none"
          />
        </label>
        
        <label class="block text-sm text-primary-700">
          Rôle / Titre
          <input
            [ngModel]="form().role"
            (ngModelChange)="form.update(f => ({ ...f, role: $event }))"
            type="text"
            placeholder="ex: CEO, Client fidèle, etc."
            class="mt-2 w-full rounded-2xl border border-gray-200 px-4 py-3 text-sm text-primary-900 focus:border-secondary-500 focus:outline-none"
          />
        </label>
      </div>

      <label class="block text-sm text-primary-700">
        Contenu du témoignage *
        <textarea
          [ngModel]="form().content"
          (ngModelChange)="form.update(f => ({ ...f, content: $event }))"
          rows="4"
          placeholder="Message laissé par l'auteur"
          class="mt-2 w-full resize-none rounded-2xl border border-gray-200 px-4 py-3 text-sm text-primary-900 focus:border-secondary-500 focus:outline-none"
        ></textarea>
      </label>

      <div class="grid gap-4 sm:grid-cols-2">
        <label class="block text-sm text-primary-700">
          Note (1 à 5)
          <input
            [ngModel]="form().note"
            (ngModelChange)="form.update(f => ({ ...f, note: $event }))"
            type="number"
            min="1"
            max="5"
            placeholder="5"
            class="mt-2 w-full rounded-2xl border border-gray-200 px-4 py-3 text-sm text-primary-900 focus:border-secondary-500 focus:outline-none"
          />
        </label>

        <div>
          <span class="block text-sm text-primary-700 mb-2">Photo de profil</span>
          <div class="flex items-center gap-4">
            <div class="h-12 w-12 rounded-full border border-gray-200 bg-gray-50 flex items-center justify-center overflow-hidden shrink-0">
              @if (imagePreview()) {
                <img [src]="imagePreview()" class="h-full w-full object-cover" />
              } @else {
                <ng-icon name="lucideImage" size="18" class="text-primary-300"></ng-icon>
              }
            </div>
            <div>
              <input 
                type="file" 
                #fileInput 
                class="hidden" 
                accept="image/*" 
                (change)="onImageSelected($event)"
              />
              <button 
                type="button" 
                class="rounded-xl border border-gray-200 px-4 py-2 text-xs font-semibold text-primary-700 hover:bg-gray-50 shadow-sm transition-all"
                (click)="fileInput.click()"
              >
                Parcourir
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="grid gap-4 sm:grid-cols-2">
        <label class="block text-sm text-primary-700">
          Visible
          <select
            [ngModel]="form().is_visible"
            (ngModelChange)="form.update(f => ({ ...f, is_visible: $event }))"
            class="mt-2 w-full rounded-2xl border border-gray-200 px-4 py-3 text-sm text-primary-900 focus:border-secondary-500 focus:outline-none"
          >
            <option [ngValue]="true">Oui</option>
            <option [ngValue]="false">Non</option>
          </select>
        </label>

        <label class="block text-sm text-primary-700">
          Position
          <input
            [ngModel]="form().position"
            (ngModelChange)="form.update(f => ({ ...f, position: $event }))"
            type="number"
            min="0"
            placeholder="0"
            class="mt-2 w-full rounded-2xl border border-gray-200 px-4 py-3 text-sm text-primary-900 focus:border-secondary-500 focus:outline-none"
          />
        </label>
      </div>

      @if (error(); as errorMsg) {
        <div class="rounded-2xl bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-600">
          {{ errorMsg }}
        </div>
      }
    </div>

    <div class="flex flex-col gap-3 border-t border-gray-200 px-6 py-4 sm:flex-row sm:justify-end">
      <button
        type="button"
        class="rounded-2xl border border-gray-200 px-5 py-3 text-sm font-semibold text-primary-700 hover:bg-gray-50"
        (click)="close()"
      >
        Annuler
      </button>
      <button
        type="button"
        class="inline-flex items-center justify-center gap-2 rounded-2xl bg-primary-800 px-5 py-3 text-sm font-semibold text-white hover:bg-primary-900"
        [disabled]="!isValid() || saving()"
        (click)="save()"
      >
        <ng-icon name="lucideSave" size="14"></ng-icon>
        <span>{{ isEdit ? 'Enregistrer' : 'Créer' }}</span>
        @if (saving()) {
          <ng-icon name="lucideLoader" size="14" class="animate-spin"></ng-icon>
        }
      </button>
    </div>
  </div>
</div>
