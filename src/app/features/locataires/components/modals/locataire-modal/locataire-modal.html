<!-- Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-4" (click)="close()">
  <div class="absolute inset-0 bg-primary-900/50 backdrop-blur-sm"></div>

  <!-- Modal -->
  <div
    class="relative z-10 w-full max-w-lg bg-white rounded-2xl shadow-2xl flex flex-col max-h-[92vh] overflow-hidden"
    (click)="$event.stopPropagation()"
  >
    <!-- ── Header ── -->
    <div
      class="flex items-center justify-between px-6 py-4 bg-gray-50 border-b border-gray-200 rounded-t-2xl flex-shrink-0"
    >
      <h3 class="font-bold text-primary-900 flex items-center gap-2">
        <ng-icon name="lucideUser" size="16" class="text-secondary-500"></ng-icon>
        {{ title() }}
      </h3>
      <button (click)="close()" class="p-1.5 hover:bg-gray-200 rounded-lg transition-all">
        <ng-icon name="lucideX" size="16" class="text-primary-400"></ng-icon>
      </button>
    </div>

    <!-- ── Body ── -->
    <div class="overflow-y-auto flex-1 min-h-0 p-6 space-y-5">
      <!-- Erreur globale -->
      @if (error()) {
        <div
          class="flex items-center gap-2 px-4 py-3 bg-red-50 border border-red-200 rounded-xl text-sm text-red-600"
        >
          <ng-icon name="lucideX" size="14"></ng-icon>
          {{ error() }}
        </div>
      }

      <!-- ── Avatar ── -->
      <div class="flex items-center gap-4">
        <div class="relative flex-shrink-0">
          @if (imagePreview()) {
            <img 
              [src]="imagePreview()" 
              alt="Aperçu" 
              class="w-20 h-20 rounded-2xl object-cover border-2 border-gray-200 shadow-sm"
            />
          } @else {
            <div class="w-20 h-20 rounded-2xl bg-secondary-200 flex items-center justify-center text-2xl font-bold text-secondary-700 border-2 border-gray-200">
              {{ initials }}
            </div>
          }

          <!-- Bouton changer image -->
          <label 
            for="imageInput" 
            class="absolute -bottom-1.5 -right-1.5 w-7 h-7 bg-primary-800 hover:bg-primary-900 rounded-lg flex items-center justify-center cursor-pointer shadow-md transition-all border-2 border-white"
          >
            <ng-icon name="lucideCamera" size="12" class="text-white"></ng-icon>
          </label>
          <input 
            type="file" 
            id="imageInput" 
            class="hidden" 
            accept="image/*"
            (change)="onImageSelected($event)"
          />
        </div>
        <div>
          <p class="text-sm font-semibold text-primary-800">Photo de profil</p>
          <p class="text-xs text-primary-400 mt-0.5">JPG, PNG · Max 2 Mo</p>
        </div>
      </div>

      <!-- ── Identité ── -->
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-primary-600 mb-1.5">
            Nom <span class="text-red-500">*</span>
          </label>
          <input
            [ngModel]="form().nom"
            (ngModelChange)="form.update(f => ({...f, nom: $event}))"
            type="text"
            placeholder="Ex: Diallo"
            class="w-full px-3 py-2 text-sm border border-gray-200 rounded-xl focus:outline-none focus:border-secondary-400 transition-colors"
            [class.border-red-300]="form().nom === '' && saving()"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold text-primary-600 mb-1.5">
            Prénom <span class="text-red-500">*</span>
          </label>
          <input
            [ngModel]="form().prenom"
            (ngModelChange)="form.update(f => ({...f, prenom: $event}))"
            type="text"
            placeholder="Ex: Fatoumata"
            class="w-full px-3 py-2 text-sm border border-gray-200 rounded-xl focus:outline-none focus:border-secondary-400 transition-colors"
          />
        </div>

        <!-- Sexe -->
        <div>
          <label class="block text-xs font-semibold text-primary-600 mb-1.5">
            Sexe <span class="text-red-500">*</span>
          </label>
          <select
            [ngModel]="form().sexe"
            (ngModelChange)="form.update(f => ({...f, sexe: $event}))"
            class="w-full px-3 py-2 text-sm border border-gray-200 rounded-xl focus:outline-none focus:border-secondary-400 bg-white transition-colors"
          >
            <option value="">Sélectionner</option>
            @for (option of genreOptions; track option.value) {
              <option [value]="option.value">{{ option.label }}</option>
            }
          </select>
        </div>

        <!-- Téléphone -->
        <div>
          <label class="block text-xs font-semibold text-primary-600 mb-1.5">
            Téléphone <span class="text-red-500">*</span>
          </label>
          <div class="relative">
            <ng-icon
              name="lucidePhone"
              size="13"
              class="absolute left-3 top-1/2 -translate-y-1/2 text-primary-300 pointer-events-none"
            >
            </ng-icon>
            <input
              [ngModel]="form().telephone"
              (ngModelChange)="form.update(f => ({...f, telephone: $event}))"
              type="tel"
              placeholder="6XX XX XX XX"
              class="w-full pl-9 pr-3 py-2 text-sm border border-gray-200 rounded-xl focus:outline-none focus:border-secondary-400 transition-colors"
            />
          </div>
        </div>
      </div>

      <!-- Email -->
      <div>
        <label class="block text-xs font-semibold text-primary-600 mb-1.5">
          Email <span class="text-red-500">*</span>
        </label>
        <div class="relative">
          <ng-icon
            name="lucideMail"
            size="13"
            class="absolute left-3 top-1/2 -translate-y-1/2 text-primary-300 pointer-events-none"
          >
          </ng-icon>
          <input
            [ngModel]="form().email"
            (ngModelChange)="form.update(f => ({...f, email: $event}))"
            type="email"
            placeholder="exemple@mail.com"
            class="w-full pl-9 pr-3 py-2 text-sm border border-gray-200 rounded-xl focus:outline-none focus:border-secondary-400 transition-colors"
          />
        </div>
      </div>

      <!-- Description -->
      <div>
        <label class="block text-xs font-semibold text-primary-600 mb-1.5">
          Description
          @if (!isEdit()) {
            <span class="text-red-500">*</span>
          } @else {
            <span class="text-primary-300 font-normal">(optionnel)</span>
          }
        </label>
        <div class="relative">
          <ng-icon
            name="lucideAlignLeft"
            size="13"
            class="absolute left-3 top-3 text-primary-300 pointer-events-none"
          >
          </ng-icon>
          <textarea
            [ngModel]="form().description"
            (ngModelChange)="form.update(f => ({...f, description: $event}))"
            rows="3"
            placeholder="Profession, informations utiles..."
            class="w-full pl-9 pr-3 py-2 text-sm border border-gray-200 rounded-xl focus:outline-none focus:border-secondary-400 resize-none transition-colors"
          >
          </textarea>
        </div>
      </div>
    </div>

    <!-- ── Footer ── -->
    <div
      class="px-6 py-4 border-t border-gray-200 flex items-center justify-between flex-shrink-0 rounded-b-2xl bg-gray-50"
    >
      <p class="text-[11px] text-primary-400">
        <span class="text-red-500">*</span> Champs obligatoires
      </p>
      <div class="flex gap-2">
        <button
          (click)="close()"
          [disabled]="saving()"
          class="px-4 py-2.5 text-sm font-semibold text-primary-600 border border-gray-200 hover:bg-gray-100 rounded-xl transition-all disabled:opacity-50"
        >
          Annuler
        </button>
        <button
          (click)="save()"
          [disabled]="!isValid() || saving()"
          class="inline-flex items-center gap-1.5 px-5 py-2.5 text-sm font-bold text-white bg-primary-800 hover:bg-primary-900 rounded-xl transition-all disabled:opacity-50 disabled:cursor-not-allowed"
        >
          @if (saving()) {
            <div
              class="w-4 h-4 border-2 border-white/40 border-t-white rounded-full animate-spin"
            ></div>
            Enregistrement...
          } @else {
            <ng-icon name="lucideSave" size="14"></ng-icon>
            {{ isEdit() ? 'Modifier' : 'Ajouter' }}
          }
        </button>
      </div>
    </div>
  </div>
</div>
