@if (loading) {
  <app-loading message="Chargement des documents…" />

} @else if (error) {
  <div class="flex flex-col items-center py-10 text-center bg-red-50
              rounded-xl border border-red-200">
    <p class="text-sm font-semibold text-red-600">{{ error }}</p>
  </div>

} @else if (documents.length === 0) {
  <app-empty-state
    icon="lucideFileX"
    title="Aucun document disponible"
    subtitle="Les documents apparaîtront ici dès que les données seront disponibles"
  />

} @else {
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
    @for (doc of documents; track doc.id) {
      <div class="flex items-center gap-3 bg-gray-50 rounded-xl p-3.5
                  border border-gray-100 hover:shadow-sm transition-all">
        <div class="w-11 h-11 rounded-xl flex items-center justify-center flex-shrink-0"
             [class]="getDocIconColor(doc.ext)">
          <ng-icon name="lucideFile" size="20"></ng-icon>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-semibold text-primary-900 truncate">{{ doc.nom }}</p>
          <p class="text-[10px] text-primary-400 mt-0.5">
            {{ doc.ext | uppercase }} · {{ doc.date | date:'dd/MM/yyyy' }}
          </p>
        </div>
        <a [href]="doc.url ?? '#'" target="_blank"
          class="p-1.5 text-primary-400 hover:text-secondary-500
                 hover:bg-secondary-50 rounded-lg transition-all"
          [class.opacity-30]="!doc.url"
          [attr.title]="doc.url ? 'Télécharger' : 'Lien non disponible'">
          <ng-icon name="lucideDownload" size="14"></ng-icon>
        </a>
      </div>
    }
  </div>
}
