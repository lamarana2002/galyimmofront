@if (loading) {
  <app-loading message="Chargement de l'historique…" />

} @else if (error) {
  <div class="flex flex-col items-center py-10 text-center bg-red-50
              rounded-xl border border-red-200">
    <p class="text-sm font-semibold text-red-600">{{ error }}</p>
  </div>

} @else if (logs.length === 0) {
  <app-empty-state
    icon="lucideActivity"
    title="Aucune activité enregistrée"
    subtitle="L'historique apparaîtra ici une fois spatie/laravel-activitylog configuré"
  />

} @else {
  <div class="relative pl-6">
    <div class="absolute left-[7px] top-2 bottom-2 w-0.5 rounded-full"
         style="background: linear-gradient(to bottom, var(--color-secondary-400), var(--color-primary-300));">
    </div>

    <div class="space-y-3">
      @for (log of logs; track log.id) {
        <div class="relative">
          <div class="absolute -left-[19px] top-3.5 w-2.5 h-2.5 rounded-full
                      border-2 border-white shadow"
               [class]="log.type === 'admin' ? 'bg-secondary-500' : 'bg-primary-400'">
          </div>
          <div class="rounded-xl p-4 border"
               [class]="log.type === 'admin'
                 ? 'bg-secondary-50 border-secondary-100'
                 : 'bg-gray-50 border-gray-100'">
            <div class="flex items-start justify-between gap-3 flex-wrap">
              <div class="flex items-start gap-2.5">
                <div class="w-7 h-7 rounded-full flex items-center justify-center
                            text-[11px] font-bold flex-shrink-0"
                     [class]="log.type === 'admin'
                       ? 'bg-secondary-200 text-secondary-700'
                       : 'bg-primary-100 text-primary-600'">
                  {{ getInitials(log.causer) }}
                </div>
                <div>
                  <div class="flex items-center gap-2">
                    <p class="text-xs font-semibold text-primary-800">{{ log.causer }}</p>
                    @if (log.type === 'admin') {
                      <span class="px-1.5 py-0.5 text-[9px] font-bold bg-secondary-200
                                   text-secondary-700 rounded-full uppercase tracking-wider">
                        Admin
                      </span>
                    }
                  </div>
                  <p class="text-sm text-primary-600 mt-0.5 leading-snug">
                    {{ log.description }}
                  </p>
                </div>
              </div>
              <span class="text-[11px] text-primary-300 whitespace-nowrap">{{ log.date }}</span>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
}
