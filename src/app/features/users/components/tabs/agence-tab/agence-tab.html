@if (loading()) {
  <div class="flex items-center justify-center gap-2 py-20 text-sm text-primary-400">
    <ng-icon name="lucideLoader" size="18" class="animate-spin" />
    Chargement...
  </div>
} @else if (!structure()) {
  <div
    class="flex flex-col items-center justify-center gap-3 rounded-2xl bg-white border border-gray-200 shadow-sm py-16 text-center"
  >
    <div class="w-14 h-14 flex items-center justify-center rounded-full bg-gray-100">
      <ng-icon name="lucideBuilding2" size="24" class="text-primary-300"></ng-icon>
    </div>
    <p class="text-sm font-medium text-primary-600">Aucune agence associée à votre compte</p>
  </div>
} @else {
  <div class="grid grid-cols-1 gap-5 lg:grid-cols-3">
    <!-- Colonne gauche : médias -->
    <div class="space-y-4">
      <!-- Cover -->
      <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-5">
        <p class="text-xs font-bold text-primary-400 uppercase tracking-wider mb-3">
          Photo de couverture
        </p>
        <div class="relative h-32 overflow-hidden rounded-xl bg-gray-100">
          @if (coverPreview()) {
            <img [src]="coverPreview()" alt="cover" class="w-full h-full object-cover" />
          } @else {
            <div class="flex h-full items-center justify-center">
              <ng-icon name="lucideImage" size="28" class="text-primary-200"></ng-icon>
            </div>
          }
          <label
            class="absolute bottom-2 right-2 flex cursor-pointer items-center gap-1.5 rounded-lg bg-black/50 px-2.5 py-1.5 text-xs font-semibold text-white backdrop-blur-sm hover:bg-black/70 transition-colors"
          >
            <ng-icon name="lucideUpload" size="12"></ng-icon>
            Changer
            <input type="file" accept="image/*" class="hidden" (change)="onCoverSelected($event)" />
          </label>
        </div>
      </div>

      <!-- Logo -->
      <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-5">
        <p class="text-xs font-bold text-primary-400 uppercase tracking-wider mb-3">Logo</p>
        <div class="flex items-center gap-4">
          <div
            class="w-16 h-16 rounded-xl bg-gray-100 overflow-hidden flex-shrink-0 border border-gray-200 flex items-center justify-center"
          >
            @if (logoPreview()) {
              <img [src]="logoPreview()" alt="logo" class="w-full h-full object-contain p-1" />
            } @else {
              <ng-icon name="lucideBuilding2" size="20" class="text-primary-300"></ng-icon>
            }
          </div>
          <label
            class="flex cursor-pointer items-center gap-1.5 px-3 py-2 text-xs font-semibold text-primary-500 bg-gray-50 border border-dashed border-gray-200 rounded-xl hover:border-secondary-300 hover:bg-secondary-50 hover:text-secondary-600 transition-all"
          >
            <ng-icon name="lucideUpload" size="13"></ng-icon>
            Changer le logo
            <input type="file" accept="image/*" class="hidden" (change)="onLogoSelected($event)" />
          </label>
        </div>
      </div>
    </div>

    <!-- Colonne droite : formulaire -->
    <div class="lg:col-span-2">
      <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6">
        <p class="text-sm font-bold text-primary-900 mb-5">Informations de l'agence</p>

        <div class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-primary-600 mb-1.5">
              Nom de l'agence <span class="text-red-400">*</span>
            </label>
            <input
              [ngModel]="form().name"
              (ngModelChange)="set('name', $event)"
              type="text"
              placeholder="Mon Agence Immobilière"
              class="w-full px-3 py-2.5 text-sm text-primary-800 placeholder-primary-300 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-secondary-400 focus:bg-white transition-all"
            />
          </div>

          <div>
            <label class="block text-xs font-semibold text-primary-600 mb-1.5">Description</label>
            <textarea
              [ngModel]="form().description"
              (ngModelChange)="set('description', $event)"
              rows="3"
              placeholder="Décrivez votre agence..."
              class="w-full px-3 py-2.5 text-sm text-primary-800 placeholder-primary-300 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-secondary-400 focus:bg-white resize-none transition-all"
            >
            </textarea>
          </div>

          <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
            <div>
              <label class="block text-xs font-semibold text-primary-600 mb-1.5">
                <span class="flex items-center gap-1">
                  <ng-icon name="lucideFacebook" size="12"></ng-icon>
                  Facebook
                </span>
              </label>
              <input
                [ngModel]="form().facebook"
                (ngModelChange)="set('facebook', $event)"
                type="url"
                placeholder="https://facebook.com/..."
                class="w-full px-3 py-2.5 text-sm text-primary-800 placeholder-primary-300 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-secondary-400 focus:bg-white transition-all"
              />
            </div>
            <div>
              <label class="block text-xs font-semibold text-primary-600 mb-1.5">
                <span class="flex items-center gap-1">
                  <ng-icon name="lucideGlobe" size="12"></ng-icon>
                  Site web
                </span>
              </label>
              <input
                [ngModel]="form().web_site"
                (ngModelChange)="set('web_site', $event)"
                type="url"
                placeholder="https://monagence.com"
                class="w-full px-3 py-2.5 text-sm text-primary-800 placeholder-primary-300 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-secondary-400 focus:bg-white transition-all"
              />
            </div>
          </div>

          <div class="flex justify-end pt-2">
            <button
              (click)="save()"
              [disabled]="saving() || !form().name.trim()"
              class="inline-flex items-center gap-1.5 px-6 py-2.5 text-sm font-bold text-white rounded-xl transition-all"
              [class]="
                !saving() && form().name.trim()
                  ? 'bg-secondary-500 hover:bg-secondary-600'
                  : 'bg-gray-200 text-gray-400 cursor-not-allowed'
              "
            >
              @if (saving()) {
                <div
                  class="w-4 h-4 border-2 border-white/40 border-t-white rounded-full animate-spin"
                ></div>
                Enregistrement...
              } @else {
                <ng-icon name="lucideSave" size="14"></ng-icon>
                Sauvegarder
              }
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
}
