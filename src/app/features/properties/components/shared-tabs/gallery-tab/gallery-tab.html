<div>
  <!-- Zone upload -->
  <div class="mb-6 border-2 border-dashed border-gray-200 rounded-2xl p-6 bg-gray-50 text-center">
    @if (!previewUrl) {
      <ng-icon name="lucideUpload" size="36" class="text-primary-300 mx-auto block mb-2"></ng-icon>
      <p class="text-sm text-primary-500 mb-1">Cliquez pour sélectionner une photo</p>
      <p class="text-xs text-primary-300">JPG, PNG, WEBP — max 5 Mo</p>
      <label
        for="galleryInput"
        class="mt-3 inline-flex items-center gap-1.5 px-4 py-2 text-xs font-semibold text-primary-600 bg-white hover:bg-gray-50 border border-gray-200 rounded-xl transition-all cursor-pointer"
      >
        <ng-icon name="lucideImage" size="13"></ng-icon>
        Parcourir
      </label>
      <input
        type="file"
        id="galleryInput"
        accept="image/*"
        (change)="fileSelected($event)"
        class="hidden"
      />
    } @else {
      <div class="flex justify-center mb-4">
        <div class="relative">
          <img
            [src]="previewUrl"
            class="w-28 h-28 object-cover rounded-xl border-2 border-secondary-400 shadow-md"
          />
          <span
            class="absolute -top-2 -right-2 w-6 h-6 bg-secondary-500 text-white rounded-full flex items-center justify-center text-xs font-bold"
            >✓</span
          >
        </div>
      </div>
      <div class="flex gap-2 justify-center">
        <button
          (click)="cancelUpload()"
          class="px-4 py-2 text-xs font-semibold text-primary-600 bg-white border border-gray-200 hover:bg-gray-50 rounded-xl transition-all"
        >
          Annuler
        </button>
        <button
          (click)="uploadImage()"
          class="inline-flex items-center gap-1.5 px-4 py-2 text-xs font-bold text-white bg-primary-800 hover:bg-primary-900 rounded-xl transition-all"
        >
          <ng-icon name="lucideUpload" size="13"></ng-icon>
          Envoyer
        </button>
      </div>
    }
  </div>

  <!-- Grille galerie -->
  @if (!gallery || gallery.length === 0) {
    <div class="flex flex-col items-center py-12 text-center">
      <ng-icon name="lucideImage" size="48" class="text-gray-200 mb-3"></ng-icon>
      <p class="text-primary-400">Aucune photo enregistrée</p>
    </div>
  } @else {
    <div class="flex items-center justify-between mb-3">
      <p class="text-xs text-primary-400">
        <span class="font-semibold text-primary-700">{{ gallery.length }}</span> photo(s)
      </p>
    </div>

    <div class="grid gap-3" style="grid-template-columns: repeat(auto-fill, minmax(180px, 1fr))">
      @for (img of gallery; track img.id; let i = $index) {
        <div
          class="relative rounded-xl overflow-hidden group cursor-pointer"
          style="aspect-ratio: 4/3"
        >
          <img
            [src]="img.image"
            [alt]="'Photo ' + (i + 1)"
            class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
          />

          <!-- Overlay -->
          <div
            class="absolute inset-0 bg-black/0 group-hover:bg-black/40 transition-all duration-200 flex items-center justify-center gap-2"
          >
            <button
              (click)="openLightbox(i)"
              class="opacity-0 group-hover:opacity-100 transition-opacity w-10 h-10 bg-white/90 rounded-full flex items-center justify-center hover:bg-white shadow-md"
            >
              <ng-icon name="lucideZoomIn" size="18" class="text-primary-700"></ng-icon>
            </button>
            <button
              (click)="confirmDeleteImage(img.id)"
              class="opacity-0 group-hover:opacity-100 transition-opacity w-10 h-10 bg-white/90 rounded-full flex items-center justify-center hover:bg-white shadow-md"
            >
              <ng-icon name="lucideTrash2" size="18" class="text-red-500"></ng-icon>
            </button>
          </div>

          <!-- Numéro -->
          <span
            class="absolute bottom-2 left-2 bg-black/50 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-md"
          >
            {{ i + 1 }}
          </span>
        </div>
      }
    </div>
  }
</div>
