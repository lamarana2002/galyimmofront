@if (!bien.documents || bien.documents.length === 0) {
  <div class="flex flex-col items-center py-20 text-center">
    <div class="w-16 h-16 bg-gray-100 rounded-2xl flex items-center justify-center mb-3">
      <ng-icon name="lucideFile" size="28" class="text-gray-300"></ng-icon>
    </div>
    <p class="font-semibold text-primary-500">Aucun document</p>
  </div>
} @else {
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
    @for (doc of bien.documents; track doc.id) {
      <div
        class="flex items-center gap-3 bg-gray-50 rounded-xl p-3.5 border border-gray-100 hover:shadow-sm transition-all"
      >
        <div
          class="w-11 h-11 rounded-xl flex items-center justify-center flex-shrink-0"
          [class]="getDocIconColor(PropertyDocumentHelper.getFileExtension(doc.title)) + ' text-white'"
        >PropertyModel
          <ng-icon name="lucideFile" size="20"></ng-icon>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-semibold text-primary-900 truncate">{{ doc.title }}</p>
          <p class="text-[10px] text-primary-400 mt-0.5">
            {{ PropertyDocumentHelper.getFileExtension(doc.title) | uppercase }} · {{ doc.created_at| date: 'dd/MM/yyyy' }}
          </p>
        </div>
        <button
          class="p-1.5 text-primary-400 hover:text-secondary-500 hover:bg-secondary-50 rounded-lg transition-all"
        >
          <ng-icon name="lucideDownload" size="14"></ng-icon>
        </button>
      </div>
    }
  </div>
}
