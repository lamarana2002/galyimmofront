<div class="fixed inset-0 z-50 flex items-center justify-center p-4" (click)="closeModal()">
  <div class="absolute inset-0 bg-primary-900/50 backdrop-blur-sm"></div>
  <div
    class="relative z-10 w-full max-w-2xl bg-white rounded-2xl shadow-2xl flex flex-col max-h-[90vh]"
    (click)="$event.stopPropagation()"
  >
    <div
      class="flex items-center justify-between px-6 py-4 bg-gray-50 border-b border-gray-200 rounded-t-2xl flex-shrink-0"
    >
      <h3 class="font-bold text-primary-900 flex items-center gap-2">
        <ng-icon
          [name]="editingUnit() ? 'lucidePencil' : 'lucidePlus'"
          size="16"
          class="text-secondary-500"
        ></ng-icon>
        {{ modalTitle() }}
      </h3>
      <button (click)="closeModal()" class="p-1.5 hover:bg-gray-200 rounded-lg transition-all">
        <ng-icon name="lucideX" size="16" class="text-primary-400"></ng-icon>
      </button>
    </div>

    <!-- Scrollable Form -->
    <div class="overflow-y-auto flex-1 p-6 bg-white">
      <div class="space-y-6">

        <!-- SECTION: Identification -->
        <div class="bg-gray-50/50 border border-gray-100 rounded-2xl p-5">
          <h4 class="text-sm font-bold text-primary-800 mb-4 flex items-center gap-2">
            <ng-icon name="lucideInfo" size="16" class="text-secondary-500"></ng-icon>
            Identification
          </h4>
          <div class="mb-4">
            <label class="block text-xs font-semibold text-primary-600 mb-1.5">Type d'unité</label>
            <select
              [ngModel]="unitForm().unit_type_id"
              (ngModelChange)="updateForm('unit_type_id', $event ? +$event : null)"
              class="w-full px-3 py-2 text-sm border border-gray-200 rounded-xl focus:outline-none focus:border-secondary-400 bg-white"
            >
              <option [value]="null">— Aucun type —</option>
              @for (type of propertyTypes(); track type.id) {
                <option [value]="type.id">{{ type.name }}</option>
              }
            </select>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div>
              <label class="block text-xs font-semibold text-primary-600 mb-1.5">
                Numéro <span class="text-red-500">*</span>
              </label>
              <input
                [ngModel]="unitForm().unit_number"
                (ngModelChange)="updateForm('unit_number', $event)"
                type="text"
                placeholder="Ex: A01"
                class="w-full px-3 py-2 text-sm border border-gray-200 rounded-xl focus:outline-none focus:border-secondary-400 bg-white"
              />
            </div>
            <div>
              <label class="block text-xs font-semibold text-primary-600 mb-1.5">Bâtiment / Entrée</label>
              <input
                [ngModel]="unitForm().entrance"
                (ngModelChange)="updateForm('entrance', $event)"
                type="text"
                placeholder="Ex: Bât A"
                class="w-full px-3 py-2 text-sm border border-gray-200 rounded-xl focus:outline-none focus:border-secondary-400 bg-white"
              />
            </div>
            <div>
              <label class="block text-xs font-semibold text-primary-600 mb-1.5">Étage</label>
              <input
                [ngModel]="unitForm().floor"
                (ngModelChange)="updateForm('floor', +$event)"
                type="number"
                min="-1"
                placeholder="0"
                class="w-full px-3 py-2 text-sm border border-gray-200 rounded-xl focus:outline-none focus:border-secondary-400 bg-white"
              />
            </div>
            <div>
              <label class="block text-xs font-semibold text-primary-600 mb-1.5">Lot n°</label>
              <input
                [ngModel]="unitForm().lot_number"
                (ngModelChange)="updateForm('lot_number', $event)"
                type="text"
                placeholder="Ex: LOT-12"
                class="w-full px-3 py-2 text-sm border border-gray-200 rounded-xl focus:outline-none focus:border-secondary-400 bg-white"
              />
            </div>
          </div>
        </div>

        <!-- SECTION: Configuration & Statut -->
        <div class="bg-gray-50/50 border border-gray-100 rounded-2xl p-5">
          <h4 class="text-sm font-bold text-primary-800 mb-4 flex items-center gap-2">
            <ng-icon name="lucideLayoutGrid" size="16" class="text-secondary-500"></ng-icon>
            Configuration & Pièces
          </h4>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div>
              <label class="block text-xs font-semibold text-primary-600 mb-1.5">Surface (m²)</label>
              <input
                [ngModel]="unitForm().surface"
                (ngModelChange)="updateForm('surface', +$event)"
                type="number" step="0.01" min="0" placeholder="0"
                class="w-full px-3 py-2 text-sm border border-gray-200 rounded-xl focus:outline-none focus:border-secondary-400 bg-white"
              />
            </div>
            <div>
              <label class="block text-xs font-semibold text-primary-600 mb-1.5">Pièces (Total)</label>
              <input
                [ngModel]="unitForm().rooms"
                (ngModelChange)="updateForm('rooms', +$event)"
                type="number" min="0" placeholder="0"
                class="w-full px-3 py-2 text-sm border border-gray-200 rounded-xl focus:outline-none focus:border-secondary-400 bg-white"
              />
            </div>
            <div>
              <label class="block text-xs font-semibold text-primary-600 mb-1.5">Chambres</label>
              <input
                [ngModel]="unitForm().bedrooms"
                (ngModelChange)="updateForm('bedrooms', +$event)"
                type="number" min="0" placeholder="0"
                class="w-full px-3 py-2 text-sm border border-gray-200 rounded-xl focus:outline-none focus:border-secondary-400 bg-white"
              />
            </div>
            <div>
              <label class="block text-xs font-semibold text-primary-600 mb-1.5">Salles d'eau</label>
              <input
                [ngModel]="unitForm().bathrooms"
                (ngModelChange)="updateForm('bathrooms', +$event)"
                type="number" min="0" placeholder="0"
                class="w-full px-3 py-2 text-sm border border-gray-200 rounded-xl focus:outline-none focus:border-secondary-400 bg-white"
              />
            </div>
          </div>
          
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-4 pt-4 border-t border-gray-200/60">
            <div>
              <label class="block text-xs font-semibold text-primary-600 mb-1.5">Statut de l'unité</label>
              <select
                [ngModel]="unitForm().status"
                (ngModelChange)="updateForm('status', $event)"
                class="w-full px-3 py-2 text-sm border border-gray-200 rounded-xl focus:outline-none focus:border-secondary-400 bg-white"
              >
                <option [value]="PropertyStatus.AVAILABLE">Disponible</option>
                <option [value]="PropertyStatus.RENTED">Loué</option>
                <option [value]="PropertyStatus.UNDER_RENOVATION">En travaux</option>
                <option [value]="PropertyStatus.FOR_SALE">En vente</option>
                <option [value]="PropertyStatus.SOLD">Vendu</option>
              </select>
            </div>
            <div class="flex flex-col justify-end pb-1 space-y-2">
              <label class="flex items-center gap-2.5 cursor-pointer">
                <input
                  type="checkbox"
                  [ngModel]="unitForm().is_primary"
                  (ngModelChange)="updateForm('is_primary', $event)"
                  class="w-[18px] h-[18px] rounded text-secondary-500 border-gray-300 focus:ring-secondary-500 cursor-pointer"
                />
                <span class="text-sm font-medium text-primary-700">Unité principale</span>
              </label>
              <label class="flex items-center gap-2.5 cursor-pointer">
                <input
                  type="checkbox"
                  [ngModel]="unitForm().is_furnished"
                  (ngModelChange)="updateForm('is_furnished', $event)"
                  class="w-[18px] h-[18px] rounded text-secondary-500 border-gray-300 focus:ring-secondary-500 cursor-pointer"
                />
                <span class="text-sm font-medium text-primary-700">Logement meublé</span>
              </label>
              <label class="flex items-center gap-2.5 cursor-pointer">
                <input
                  type="checkbox"
                  [ngModel]="unitForm().is_active"
                  (ngModelChange)="updateForm('is_active', $event)"
                  class="w-[18px] h-[18px] rounded text-secondary-500 border-gray-300 focus:ring-secondary-500 cursor-pointer"
                />
                <span class="text-sm font-medium text-primary-700">Unité active (Publiée)</span>
              </label>
            </div>
          </div>
        </div>

        <!-- SECTION: Finances -->
        <div class="bg-gray-50/50 border border-gray-100 rounded-2xl p-5">
          <h4 class="text-sm font-bold text-primary-800 mb-4 flex items-center gap-2">
            <ng-icon name="lucideBanknote" size="16" class="text-secondary-500"></ng-icon>
            Données Financières
          </h4>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div>
              <label class="block text-xs font-semibold text-primary-600 mb-1.5">Loyer mensuel (GNF)</label>
              <input
                [ngModel]="unitForm().rent_amount"
                (ngModelChange)="updateForm('rent_amount', +$event)"
                type="number" min="0" placeholder="0"
                class="w-full px-3 py-2 text-sm border border-gray-200 rounded-xl focus:outline-none focus:border-secondary-400 bg-white"
              />
            </div>
            <div>
              <label class="block text-xs font-semibold text-primary-600 mb-1.5">Caution (GNF)</label>
              <input
                [ngModel]="unitForm().security_deposit"
                (ngModelChange)="updateForm('security_deposit', +$event)"
                type="number" min="0" placeholder="0"
                class="w-full px-3 py-2 text-sm border border-gray-200 rounded-xl focus:outline-none focus:border-secondary-400 bg-white"
              />
            </div>
            <div>
              <label class="block text-xs font-semibold text-primary-600 mb-1.5">Charges/mois (GNF)</label>
              <input
                [ngModel]="unitForm().monthly_charges"
                (ngModelChange)="updateForm('monthly_charges', +$event)"
                type="number" min="0" placeholder="0"
                class="w-full px-3 py-2 text-sm border border-gray-200 rounded-xl focus:outline-none focus:border-secondary-400 bg-white"
              />
            </div>
            <div>
              <label class="block text-xs font-semibold text-primary-600 mb-1.5">Prix de vente (GNF)</label>
              <input
                [ngModel]="unitForm().sale_price"
                (ngModelChange)="updateForm('sale_price', +$event)"
                type="number" min="0" placeholder="0"
                class="w-full px-3 py-2 text-sm border border-gray-200 rounded-xl focus:outline-none focus:border-secondary-400 bg-white"
              />
            </div>
          </div>
        </div>

        <!-- SECTION: Description -->
        <div class="bg-gray-50/50 border border-gray-100 rounded-2xl p-5">
          <label class="block text-xs font-semibold text-primary-600 mb-1.5">Description (Optionnel)</label>
          <textarea
            [ngModel]="unitForm().description"
            (ngModelChange)="updateForm('description', $event)"
            rows="2"
            placeholder="Informations supplémentaires concernant l'unité..."
            class="w-full px-3 py-2 text-sm border border-gray-200 rounded-xl focus:outline-none focus:border-secondary-400 bg-white resize-none"
          ></textarea>
        </div>

        <!-- SECTION: Modèle 3D -->
        <div class="bg-gray-50/50 border border-gray-100 rounded-2xl p-5">
          <h4 class="text-sm font-bold text-primary-800 mb-4 flex items-center gap-2">
            <ng-icon name="lucideImage" size="16" class="text-secondary-500"></ng-icon>
            Modèle 3D (Optionnel)
          </h4>
          <label class="block text-xs font-semibold text-primary-600 mb-1.5">
            Fichier .glb / .gltf (max 50 Mo)
          </label>
          <input
            type="file"
            accept=".glb,.gltf"
            (change)="onModel3dSelected($event)"
            class="w-full text-sm text-primary-600 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-secondary-50 file:text-secondary-700 hover:file:bg-secondary-100 cursor-pointer"
          />
          @if (unitForm().model_3d) {
            <p class="mt-2 text-xs text-green-600 font-medium">
              Fichier sélectionné : {{ unitForm().model_3d!.name }}
            </p>
          }
        </div>

      </div>
    </div>

    <!-- Footer Modal -->
    <div
      class="px-6 py-4 border-t border-gray-200 flex items-center justify-end gap-2 flex-shrink-0"
    >
      <button
        (click)="closeModal()"
        class="px-4 py-2.5 text-sm font-semibold text-primary-600 border border-gray-200 hover:bg-gray-50 rounded-xl transition-all"
      >
        Annuler
      </button>
      <button
        (click)="save()"
        [disabled]="isSaving()"
        class="inline-flex items-center gap-1.5 px-5 py-2.5 text-sm font-bold text-white bg-primary-800 hover:bg-primary-900 rounded-xl transition-all disabled:opacity-60 disabled:cursor-not-allowed"
      >
        <ng-icon name="lucideSave" size="16"></ng-icon>
        {{ editingUnit() ? 'Enregistrer les modifs' : 'Créer l\'unité' }}
      </button>
    </div>
  </div>
</div>
