<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/30 px-4 py-6">
  <div class="w-full max-w-2xl rounded-3xl bg-white shadow-2xl overflow-hidden">
    <div class="flex items-center justify-between gap-3 px-6 py-5 border-b border-gray-200">
      <div>
        <p class="text-lg font-bold text-primary-900">{{ title() }}</p>
        <p class="text-xs text-primary-400">Renseignez les informations du membre.</p>
      </div>
      <button type="button" class="text-primary-400 hover:text-primary-700" (click)="close()">
        <ng-icon name="lucideX" size="18"></ng-icon>
      </button>
    </div>

    <div class="px-6 py-5 space-y-5">
      <div class="grid gap-4 sm:grid-cols-2">
        <label class="block text-sm text-primary-700">
          Nom
          <input
            [ngModel]="form().name"
            (ngModelChange)="form.update(f => ({ ...f, name: $event }))"
            type="text"
            placeholder="Nom du membre"
            class="mt-2 w-full rounded-2xl border border-gray-200 px-4 py-3 text-sm text-primary-900 focus:border-secondary-500 focus:outline-none"
          />
        </label>

        <label class="block text-sm text-primary-700">
          Fonction
          <input
            [ngModel]="form().role"
            (ngModelChange)="form.update(f => ({ ...f, role: $event }))"
            type="text"
            placeholder="Fonction du membre (ex : DG, comptable)"
            class="mt-2 w-full rounded-2xl border border-gray-200 px-4 py-3 text-sm text-primary-900 focus:border-secondary-500 focus:outline-none"
          />
        </label>
      </div>

      <label class="block text-sm text-primary-700">
        Description
        <textarea
          [ngModel]="form().description"
          (ngModelChange)="form.update(f => ({ ...f, description: $event }))"
          rows="4"
          placeholder="Description du membre"
          class="mt-2 w-full resize-none rounded-2xl border border-gray-200 px-4 py-3 text-sm text-primary-900 focus:border-secondary-500 focus:outline-none"
        ></textarea>
      </label>

      <div class="grid gap-4 sm:grid-cols-2">
        <label class="block text-sm text-primary-700">
          Public
          <select
            [ngModel]="form().is_public"
            (ngModelChange)="form.update(f => ({ ...f, is_public: $event }))"
            class="mt-2 w-full rounded-2xl border border-gray-200 px-4 py-3 text-sm text-primary-900 focus:border-secondary-500 focus:outline-none"
          >
            <option [ngValue]="true">Oui</option>
            <option [ngValue]="false">Non</option>
          </select>
        </label>

        <label class="block text-sm text-primary-700">
          Ordre
          <input
            [ngModel]="form().sort_order"
            (ngModelChange)="form.update(f => ({ ...f, sort_order: $event }))"
            type="number"
            min="0"
            class="mt-2 w-full rounded-2xl border border-gray-200 px-4 py-3 text-sm text-primary-900 focus:border-secondary-500 focus:outline-none"
          />
        </label>
      </div>

      <div class="grid gap-3 sm:grid-cols-[1fr_auto] items-center">
        <div class="flex items-center gap-3">
          <label
            class="inline-flex cursor-pointer items-center gap-2 rounded-2xl border border-dashed border-gray-300 bg-gray-50 px-4 py-3 text-sm font-medium text-primary-700 transition hover:border-secondary-400 hover:bg-white"
          >
            <ng-icon name="lucideUpload" size="14"></ng-icon>
            {{ imageLabel }}
            <input type="file" accept="image/*" class="hidden" (change)="onImageSelected($event)" />
          </label>

          @if (imagePreview()) {
            <img
              src="{{ imagePreview() }}"
              alt="Aperçu"
              class="h-14 w-14 rounded-2xl object-cover border border-gray-200"
            />
          }
        </div>

        <div class="text-xs text-primary-400">
          Image max 2 Mo. Format JPG, PNG ou WEBP conseillé.
        </div>
      </div>

      @if (error(); as errorMsg) {
        <div class="rounded-2xl bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-600">
          {{ errorMsg }}
        </div>
      }
    </div>

    <div class="flex flex-col gap-3 border-t border-gray-200 px-6 py-4 sm:flex-row sm:justify-end">
      <button
        type="button"
        class="rounded-2xl border border-gray-200 px-5 py-3 text-sm font-semibold text-primary-700 hover:bg-gray-50"
        (click)="close()"
      >
        Annuler
      </button>
      <button
        type="button"
        class="inline-flex items-center justify-center gap-2 rounded-2xl bg-primary-800 px-5 py-3 text-sm font-semibold text-white hover:bg-primary-900"
        [disabled]="!isValid() || saving()"
        (click)="save()"
      >
        <ng-icon name="lucideSave" size="14"></ng-icon>
        <span>{{ isEdit() ? 'Enregistrer' : 'Créer' }}</span>
        @if (saving()) {
          <ng-icon name="lucideLoader" size="14" class="animate-spin"></ng-icon>
        }
      </button>
    </div>
  </div>
</div>
