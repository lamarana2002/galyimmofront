<div
  class="fixed inset-0 z-50 flex items-center justify-center p-4"
  (click)="cancelToSendMessage()"
>
  <div class="absolute inset-0 bg-primary-900/50 backdrop-blur-sm"></div>
  <div
    class="relative z-10 w-full max-w-md bg-white rounded-2xl shadow-2xl p-6"
    (click)="$event.stopPropagation()"
  >
    <div class="flex items-center justify-between mb-5">
      <h3 class="font-bold text-primary-900 flex items-center gap-2">
        <ng-icon name="lucideMessageSquare" size="16" class="text-secondary-500"></ng-icon>
        {{ title }}
      </h3>
      <button (click)="cancelToSendMessage()" class="p-1.5 hover:bg-gray-100 rounded-lg">
        <ng-icon name="lucideX" size="16" class="text-primary-400"></ng-icon>
      </button>
    </div>
    @if (recipientFullName || recipientEmail) {
      <div class="flex items-center gap-3 p-3 bg-gray-50 rounded-xl mb-4">
        <div
          class="w-9 h-9 rounded-full bg-secondary-200 flex items-center justify-center text-sm font-bold text-secondary-700"
        >
          {{ getInitials(recipientFullName) }}
        </div>
        <div>
          <p class="text-sm font-semibold text-primary-800">
            {{ recipientFullName }}
          </p>
          <p class="text-xs text-primary-400">{{ recipientEmail }}</p>
        </div>
      </div>
    }
    <div class="space-y-3 mb-4">
      <div>
        <label class="block text-xs font-semibold text-primary-600 mb-1.5">Sujet</label>
        <input
          [(ngModel)]="contactSubject"
          type="text"
          class="w-full px-3 py-2 text-sm border border-gray-200 rounded-xl focus:outline-none focus:border-secondary-400"
        />
      </div>
      <div>
        <label class="block text-xs font-semibold text-primary-600 mb-1.5">Message</label>
        <textarea
          [(ngModel)]="contactMessage"
          rows="4"
          placeholder="Votre message..."
          class="w-full px-3 py-2 text-sm border border-gray-200 rounded-xl focus:outline-none focus:border-secondary-400 resize-none"
        >
        </textarea>
      </div>
    </div>
    <div class="flex gap-2">
      <button
        (click)="sendContactMessage()"
        [disabled]="!contactMessage.trim()"
        class="flex-1 flex items-center justify-center gap-2 py-2.5 text-sm font-semibold text-white bg-primary-800 hover:bg-primary-900 rounded-xl transition-all disabled:opacity-50"
      >
        <ng-icon name="lucideSend" size="14"></ng-icon> Envoyer
      </button>
      <button
        (click)="cancelToSendMessage()"
        class="px-4 py-2.5 text-sm font-semibold text-primary-600 border border-gray-200 hover:bg-gray-50 rounded-xl transition-all"
      >
        Annuler
      </button>
    </div>
  </div>
</div>
