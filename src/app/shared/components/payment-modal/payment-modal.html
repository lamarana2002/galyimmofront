<!-- Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-900/60 backdrop-blur-sm animate-fade-in">

  <!-- Modal Content -->
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden" (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="px-5 py-3.5 border-b border-gray-100 flex items-center justify-between bg-gray-50/50">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-primary-100 flex items-center justify-center flex-shrink-0">
          <ng-icon name="lucideBanknote" size="16" class="text-primary-700"></ng-icon>
        </div>
        <h3 class="text-sm font-bold text-gray-900">Enregistrer un paiement</h3>
      </div>
      <button type="button" (click)="onClose()" class="text-gray-400 hover:text-gray-600 hover:bg-gray-100 p-1.5 rounded-lg transition-colors">
        <ng-icon name="lucideX" size="16"></ng-icon>
      </button>
    </div>

    <!-- Body -->
    <form [formGroup]="paymentForm" (ngSubmit)="onSubmit()" class="p-4 space-y-3">

      <!-- Montant -->
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Montant reçu <span class="text-red-500">*</span></label>
        <div class="relative">
          <input
            type="number"
            formControlName="amount"
            class="block w-full pl-3 pr-12 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-xl font-bold text-gray-900 transition-colors"
            placeholder="0"
          >
          <div class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none">
            <span class="text-sm text-gray-400 font-semibold">GNF</span>
          </div>
        </div>
        @if (balanceDue > 0) {
          <p class="mt-1 text-xs text-emerald-600 font-medium flex items-center gap-1">
            <ng-icon name="lucideCheckCircle" size="12"></ng-icon>
            Reste à payer : {{ balanceDue | number }} GNF pré-rempli.
          </p>
        }
      </div>

      <!-- Période + Date + Statut en grille 2×2 -->
      <div class="grid grid-cols-2 gap-2.5">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Période du <span class="text-red-500">*</span></label>
          <input type="date" formControlName="period_start"
            class="block w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-xs transition-colors">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">au <span class="text-red-500">*</span></label>
          <input type="date" formControlName="period_end"
            class="block w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-xs transition-colors">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Date de réception <span class="text-red-500">*</span></label>
          <input type="date" formControlName="paid_at"
            class="block w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-xs transition-colors">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Statut <span class="text-red-500">*</span></label>
          <select formControlName="status"
            class="block w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-xs transition-colors">
            @for (st of statuses; track st.id) {
              <option [value]="st.id">{{ st.label }}</option>
            }
          </select>
        </div>
      </div>

      <!-- Méthode — rangée compacte -->
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1.5">Méthode de paiement <span class="text-red-500">*</span></label>
        <div class="grid grid-cols-4 gap-1.5">
          @for (method of methods; track method.id) {
            <label class="cursor-pointer">
              <input type="radio" formControlName="method" [value]="method.id" class="peer sr-only">
              <div class="flex flex-col items-center justify-center p-2 rounded-xl border-2 border-gray-100 bg-white hover:bg-gray-50 peer-checked:border-primary-500 peer-checked:bg-primary-50 transition-all gap-1">
                <ng-icon [name]="method.icon" size="18" class="text-gray-400 peer-checked:text-primary-600"></ng-icon>
                <span class="text-[10px] font-semibold text-gray-600 peer-checked:text-primary-700 text-center leading-tight">{{ method.label }}</span>
              </div>
            </label>
          }
        </div>
      </div>

      <!-- Notes -->
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Notes (optionnel)</label>
        <input
          type="text"
          formControlName="notes"
          class="block w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-xs transition-colors"
          placeholder="N° chèque, réf. transaction…"
        >
      </div>

      <!-- Footer Actions -->
      <div class="flex items-center gap-2.5 pt-1 border-t border-gray-100">
        <button
          type="button"
          (click)="onClose()"
          class="flex-1 px-4 py-2.5 text-sm font-semibold text-gray-700 bg-white border border-gray-200 rounded-xl hover:bg-gray-50 transition-colors"
        >
          Annuler
        </button>
        <button
          type="submit"
          [disabled]="paymentForm.invalid || isSubmitting"
          class="flex-1 px-4 py-2.5 text-sm font-semibold text-white bg-primary-700 border border-transparent rounded-xl hover:bg-primary-800 transition-colors disabled:opacity-50 flex justify-center items-center gap-2"
        >
          @if (isSubmitting) {
            <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Enregistrement…
          } @else {
            Valider
          }
        </button>
      </div>

    </form>
  </div>
</div>
