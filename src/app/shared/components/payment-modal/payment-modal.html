<!-- Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-900/60 backdrop-blur-sm animate-fade-in">
  
  <!-- Modal Content -->
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden transform transition-all" (click)="$event.stopPropagation()">
    
    <!-- Header -->
    <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between bg-gray-50/50">
      <h3 class="text-lg font-bold text-gray-900">Enregistrer un paiement</h3>
      <button type="button" (click)="onClose()" class="text-gray-400 hover:text-gray-600 hover:bg-gray-100 p-2 rounded-full transition-colors">
        <ng-icon name="lucideX" size="20"></ng-icon>
      </button>
    </div>

    <!-- Body (Form) -->
    <form [formGroup]="paymentForm" (ngSubmit)="onSubmit()" class="p-6">
      
      <!-- Montant -->
      <div class="mb-5">
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Montant reçu (FCFA) <span class="text-red-500">*</span></label>
        <div class="relative">
          <input type="number" formControlName="amount" 
            class="block w-full pl-4 pr-12 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-lg font-bold text-gray-900 transition-colors"
            placeholder="0">
          <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none">
            <span class="text-gray-500 font-medium">FCFA</span>
          </div>
        </div>
        @if (balanceDue > 0) {
          <p class="mt-2 text-xs text-emerald-600 font-medium flex items-center gap-1">
            <ng-icon name="lucideCheckCircle" size="14"></ng-icon>
            Le reste à payer de {{ balanceDue | number }} FCFA a été pré-rempli.
          </p>
        }
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 mb-5">
        <!-- Période Du -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Période payée (Du) <span class="text-red-500">*</span></label>
          <input type="date" formControlName="period_start" 
            class="block w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm transition-colors">
        </div>

        <!-- Période Au -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Période payée (Au) <span class="text-red-500">*</span></label>
          <input type="date" formControlName="period_end" 
            class="block w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm transition-colors">
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 mb-5">
        <!-- Date de réception -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Date de réception <span class="text-red-500">*</span></label>
          <input type="date" formControlName="paid_at" 
            class="block w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm transition-colors">
        </div>

        <!-- Statut -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Statut actuel <span class="text-red-500">*</span></label>
          <select formControlName="status" 
            class="block w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm transition-colors">
            @for (st of statuses; track st.id) {
              <option [value]="st.id">{{ st.label }}</option>
            }
          </select>
        </div>
      </div>

      <!-- Méthodes -->
      <div class="mb-5">
        <label class="block text-sm font-medium text-gray-700 mb-2">Méthode de paiement <span class="text-red-500">*</span></label>
        <div class="grid grid-cols-2 gap-3">
          @for (method of methods; track method.id) {
            <label class="cursor-pointer">
              <input type="radio" formControlName="method" [value]="method.id" class="peer sr-only">
              <div class="flex flex-col items-center justify-center p-3 rounded-xl border-2 border-gray-100 bg-white hover:bg-gray-50 peer-checked:border-primary-500 peer-checked:bg-primary-50 transition-all">
                <ng-icon [name]="method.icon" size="24" class="text-gray-500 peer-checked:text-primary-600 mb-2"></ng-icon>
                <span class="text-xs font-semibold text-gray-700 peer-checked:text-primary-700">{{ method.label }}</span>
              </div>
            </label>
          }
        </div>
      </div>

      <!-- Notes -->
      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Notes ou Références (Optionnel)</label>
        <textarea formControlName="notes" rows="2" 
          class="block w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm transition-colors resize-none"
          placeholder="Numéro de chèque, référence transaction..."></textarea>
      </div>

      <!-- Footer Actions -->
      <div class="flex items-center gap-3 pt-4 border-t border-gray-100">
        <button type="button" (click)="onClose()" 
          class="flex-1 px-4 py-2.5 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-xl hover:bg-gray-50 focus:ring-2 focus:ring-gray-200 transition-colors">
          Annuler
        </button>
        <button type="submit" [disabled]="paymentForm.invalid || isSubmitting"
          class="flex-1 px-4 py-2.5 text-sm font-medium text-white bg-primary-600 border border-transparent rounded-xl hover:bg-primary-700 focus:ring-4 focus:ring-primary-200 transition-colors disabled:opacity-50 flex justify-center items-center gap-2">
          @if (isSubmitting) {
            <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Enregistrement...
          } @else {
            Valider le paiement
          }
        </button>
      </div>

    </form>
  </div>
</div>
